<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#111318" />
    <meta
      name="description"
      content="Reporta o encuentra albergues, centros de acopio y necesidades urgentes en cualquier municipio de Colombia, con información actualizada por la propia comunidad — sin necesidad de crear cuenta."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical fijo a la home: esta es una SPA sin SSR/prerendering, así
         que index.html es el único documento estático que existe — todas las
         rutas de React Router (/reportar, /reporte/:id, etc.) sirven este
         mismo HTML. Un canonical por ruta requeriría SSR o prerendering, que
         no tenemos. La única excepción real ya resuelta es /r/:id (puerta de
         compartir server-rendered en el backend, ver shareGateway.routes.ts),
         que genera su propio <head> y no pasa por este archivo. -->
    <link rel="canonical" href="https://aquiayudamosve.co/" />

    <title>AquiAyudamosVE — Ayuda comunitaria en Colombia</title>

    <!-- Open Graph / Twitter Card: leídos por bots de vista previa
         (WhatsApp, Telegram, Facebook, X) que NO ejecutan JavaScript, así
         que esto es lo único que verán al compartir la home o cualquier
         ruta de la SPA sin puerta propia (ver comentario del canonical
         arriba). og:image usa una URL absoluta porque los bots de vista
         previa no resuelven rutas relativas de forma confiable. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AquiAyudamosVE" />
    <meta property="og:title" content="AquiAyudamosVE — Ayuda comunitaria en Colombia" />
    <meta
      property="og:description"
      content="Reporta o encuentra albergues, centros de acopio y necesidades urgentes en cualquier municipio de Colombia, con información actualizada por la propia comunidad — sin necesidad de crear cuenta."
    />
    <meta property="og:url" content="https://aquiayudamosve.co/" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:image" content="https://aquiayudamosve.co/logo-lockup.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Logo de AquiAyudamosVE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AquiAyudamosVE — Ayuda comunitaria en Colombia" />
    <meta
      name="twitter:description"
      content="Reporta o encuentra albergues, centros de acopio y necesidades urgentes en cualquier municipio de Colombia, actualizado por la comunidad."
    />
    <meta name="twitter:image" content="https://aquiayudamosve.co/logo-lockup.png" />

    <!-- Google tag (gtag.js) — la inicialización vive en /gtag-init.js (mismo
         origen) en vez de un <script> inline, para no necesitar 'unsafe-inline'
         en la CSP (ver backend/src/app.ts, scriptSrc). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LEY8L16ZSD"></script>
    <script src="/gtag-init.js"></script>

    <!-- WebSite/Organization: seguro para toda la home porque describe el
         sitio en sí, no un reporte individual (nunca Article/Event por
         reporte — ver .claude/agents/seo-specialist.md, el contenido de un
         reporte es comunitario y puede quedar desactualizado u obsoleto en
         horas). JSON-LD no ejecuta como script, así que no importa que la
         CSP del backend (que de todos modos no aplica a este sitio estático
         servido por Netlify) tenga scriptSrc restringido. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "AquiAyudamosVE",
            "alternateName": "Aquí Ayudamos, Ve",
            "url": "https://aquiayudamosve.co/",
            "description": "Plataforma comunitaria para coordinar albergues, centros de acopio y necesidades de ayuda en tiempo real en cualquier municipio de Colombia.",
            "inLanguage": "es-CO"
          },
          {
            "@type": "Organization",
            "name": "AquiAyudamosVE",
            "url": "https://aquiayudamosve.co/",
            "logo": "https://aquiayudamosve.co/logo-lockup.png",
            "description": "Iniciativa comunitaria, sin fines de lucro, nacida como respuesta al terremoto del 10 de agosto de 2026 en Cali, Colombia."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
