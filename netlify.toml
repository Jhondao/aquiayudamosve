[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxies /api/* to the Render backend so the browser sees everything as
# same-origin (netlify domain) — this is what lets the httpOnly refresh
# cookie work without switching it to SameSite=None. Replace the target
# below with your real Render service URL after deploying the backend.
[[redirects]]
  from = "/api/*"
  to = "https://aquiayudamosve.onrender.com/api/:splat"
  status = 200
  force = true

# Same proxy pattern for the WhatsApp/social share gateway (backend, outside
# /api — serves HTML with OG tags, not JSON). Must come before the SPA
# catch-all below, since Netlify evaluates redirects in order.
[[redirects]]
  from = "/r/*"
  to = "https://aquiayudamosve.onrender.com/r/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (react-router-dom) don't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
